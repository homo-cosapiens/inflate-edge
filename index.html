<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ふくらめ、ギリギリ</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b18;color:#eafcff;font:16px system-ui;padding:12px}main{width:min(100%,424px);text-align:center}h1{color:#7af7ff}.stats{display:flex;gap:8px}.stats div{flex:1;background:#10172a;border:1px solid #263957;border-radius:9px;padding:8px}.stats strong{display:block;font-size:1.3rem}canvas{width:100%;height:auto;aspect-ratio:4/5;background:#0a1021;border:1px solid #27536b;border-radius:12px;touch-action:none}p{color:#a9bfd6;font-size:.9rem}button{border:0;border-radius:99px;padding:11px 22px;background:#7af7ff;color:#07101d;font:700 1rem system-ui}
</style></head><body><main><h1>ふくらめ、ギリギリ</h1><div class="stats"><div>スコア<strong id="score">0</strong></div><div>残り<strong id="time">60</strong></div><div>ライフ<strong id="lives">3</strong></div></div><canvas id="game" width="400" height="500"></canvas><p>押して球を膨らませ、刃を見てタイミングよく離そう。</p><button id="start">開始 / リトライ</button></main><script src="game.js" defer></script></body></html>
